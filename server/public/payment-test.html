
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopX Razorpay Webhook Test</title>
</head>

<body>
    <h1>ShopX — Razorpay Webhook Test</h1>

    <p>
        आधी browser मधून ShopX login केलेले असणे आवश्यक आहे.
    </p>

    <p>
        हा test payment Checkout response दाखवेल.
        Payment verification API आपोआप call होणार नाही.
    </p>

    <label for="orderId">ShopX Order ID:</label>
    <input
        type="text"
        id="orderId"
        placeholder="MongoDB Order ID"
        autocomplete="off"
    />

    <br /><br />

    <button id="payButton">Pay with Razorpay Test Mode</button>

    <pre id="result"></pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const payButton = document.getElementById('payButton');
        const result = document.getElementById('result');

        const API_BASE_URL = 'http://localhost:8080/api/v1';
        const RAZORPAY_KEY_ID = 'rzp_test_TlTNo1xfaNE8Jj';

        payButton.addEventListener('click', async () => {
            const orderId =
                document.getElementById('orderId').value.trim();

            if (!orderId) {
                result.textContent = 'ShopX Order ID आवश्यक आहे.';
                return;
            }

            payButton.disabled = true;
            result.textContent = 'Creating Razorpay order...';

            try {
                // 1. Create Razorpay order through ShopX backend.
                const response = await fetch(
                    `${API_BASE_URL}/payments/${encodeURIComponent(orderId)}`,
                    {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }
                );

                const body = await response.json();

                if (!response.ok || !body.success) {
                    throw new Error(
                        body.message ||
                        `Order creation failed (${response.status}).`
                    );
                }

                const paymentData = body.data;

                // 2. Open Razorpay Checkout.
                const checkout = new Razorpay({
                    key: RAZORPAY_KEY_ID,
                    amount: paymentData.amount,
                    currency: paymentData.currency,
                    name: 'ShopX',
                    description: 'ShopX webhook test',
                    order_id: paymentData.razorpayOrderId,

                    // 3. Display Checkout response only.
                    // Do not call /payments/verify here.
                    handler: function (paymentResponse) {
                        result.textContent =
                            'Razorpay Checkout response received.\n\n' +
                            'This does NOT prove that the webhook was processed.\n\n' +
                            'Check Razorpay Dashboard webhook deliveries and ' +
                            'verify Payment and Order in MongoDB.\n\n' +
                            JSON.stringify(paymentResponse, null, 2);
                    },

                    modal: {
                        ondismiss: function () {
                            result.textContent =
                                'Checkout बंद केले. Payment status आणि ' +
                                'webhook delivery स्वतंत्रपणे तपासा.';
                        }
                    },

                    theme: {
                        color: '#3399cc'
                    }
                });

                checkout.on('payment.failed', function (event) {
                    result.textContent =
                        'Razorpay Checkout payment.failed:\n\n' +
                        JSON.stringify(event.error, null, 2);
                });

                checkout.open();

            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            } finally {
                payButton.disabled = false;
            }
        });
    </script>
</body>

</html>

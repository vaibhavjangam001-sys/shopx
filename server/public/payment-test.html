<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopX Razorpay Payment Test</title>
</head>

<body>
    <h1>ShopX — Razorpay Payment Test</h1>

    <p>आधी browser मधून ShopX login केलेले असणे आवश्यक आहे.</p>

    <label for="orderId">ShopX Order ID:</label>

    <input type="text" id="orderId" placeholder="MongoDB Order ID" autocomplete="off" />

    <br /><br />

    <button id="payButton">Pay with Razorpay Test Mode</button>

    <pre id="result"></pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const payButton = document.getElementById('payButton');
        const result = document.getElementById('result');

        const API_BASE_URL = 'http://localhost:8080/api/v1';
        const RAZORPAY_KEY_ID = 'rzp_test_TlTNo1xfaNE8Jj';

        payButton.addEventListener('click', async () => {

            const orderId =
                document.getElementById('orderId').value.trim();

            if (!orderId) {
                result.textContent = 'ShopX Order ID required.';
                return;
            }

            payButton.disabled = true;
            result.textContent = 'Creating Razorpay order...';

            try {

                // 1. Create Razorpay order.
                const response = await fetch(
                    `${API_BASE_URL}/payments/${encodeURIComponent(orderId)}`,
                    {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }
                );

                const body = await response.json();

                if (!response.ok || !body.success) {
                    throw new Error(
                        body.message ||
                        `Order creation failed (${response.status})`
                    );
                }

                const paymentData = body.data;

                // 2. Open Razorpay Checkout.
                const checkout = new Razorpay({

                    key: RAZORPAY_KEY_ID,
                    amount: paymentData.amount,
                    currency: paymentData.currency,
                    name: 'ShopX',
                    description: 'ShopX payment testing',
                    order_id: paymentData.razorpayOrderId,

                    // 3. Successful Checkout response.
                    handler: async function (paymentResponse) {

                        result.textContent =
                            'Checkout successful!\n' +
                            'Verifying payment with ShopX backend...\n';

                        try {

                            // 4. Call Payment Verification API.
                            const verifyResponse = await fetch(
                                `${API_BASE_URL}/payments/verify`,
                                {
                                    method: 'POST',
                                    credentials: 'include',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        razorpay_order_id:
                                            paymentResponse.razorpay_order_id,

                                        razorpay_payment_id:
                                            paymentResponse.razorpay_payment_id,

                                        razorpay_signature:
                                            paymentResponse.razorpay_signature
                                    })
                                }
                            );

                            const verifyData = await verifyResponse.json();

                            if (!verifyResponse.ok || !verifyData.success) {
                                throw new Error(
                                    verifyData.message ||
                                    'Payment verification failed.'
                                );
                            }

                            result.textContent =
                                'PAYMENT VERIFIED SUCCESSFULLY!\n\n' +
                                JSON.stringify(verifyData, null, 2);

                        } catch (error) {

                            result.textContent =
                                'PAYMENT VERIFICATION ERROR:\n' +
                                error.message;

                        } finally {
                            payButton.disabled = false;
                        }
                    },

                    modal: {
                        ondismiss: function () {
                            result.textContent =
                                'Checkout closed. Check payment status separately.';
                            payButton.disabled = false;
                        }
                    },

                    theme: {
                        color: '#3399cc'
                    }
                });

                // 5. Handle failed payment.
                checkout.on('payment.failed', function (event) {

                    result.textContent =
                        'RAZORPAY PAYMENT FAILED:\n\n' +
                        JSON.stringify(event.error, null, 2);

                    payButton.disabled = false;
                });

                checkout.open();

            } catch (error) {

                result.textContent = 'ERROR: ' + error.message;
                payButton.disabled = false;
            }
        });
    </script>
</body>

</html>
